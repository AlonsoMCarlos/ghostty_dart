# Runs `mise run check` (format check, analyze, tests, demo app and frame
# benchmark harness tests, tool and release-script tests, cooldown,
# translation check, workflow and shell lint) on Linux, macOS (arm64) and Windows, against libghostty-vt built
# on each runner from the minisign- and sha256-verified upstream tarballs.
# A separate job scans the full git history and the working tree for leaked
# secrets (gitleaks). The pana job scores both published packages
# (ghostty_dart, ghostty_dart_flutter) as pub.dev does and validates their
# publish archives (ADR 0010). On Linux the check job also builds the demo
# app for the desktop. The frame-time benchmark (bench:widget) is not run in
# CI: shared runners without a GPU make its numbers noise.
#
# Supply chain (AGENTS.md): actions pinned by commit SHA to releases at least
# 3 days old, no secrets, read-only token, no persisted git credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Git Bash on Windows: the native scripts and mise's `bash -c` tasks need it.
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (mise.toml, verified against mise.lock)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        # Installing takes 15-80 s; a stalled download (seen once, 30 min) fails fast.
        timeout-minutes: 10
        with:
          version: 2026.11.2 # keep in sync with the other workflows (checked by test:release)
          cache: true

      - name: Locate pub cache
        run: echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}

      # Only the downloads are cached; fetch_upstream.sh re-verifies the
      # minisign signature and the pinned sha256 on every run.
      - name: Cache upstream libghostty-vt tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-cache/*.tar.gz
          key: native-src-${{ hashFiles('native/upstream.json') }}
          enableCrossOsArchive: true

      - name: Resolve dependencies
        run: mise run deps

      - name: Build libghostty-vt for the host
        run: mise run native:host

      # The release checker (tool/native/check_binary.dart) on a real ELF, PE
      # or Mach-O per runner, every CI run, not only at release time.
      - name: Check the host build (format, arch, exports, deps)
        run: mise run native:check --host

      # Linux only: Flutter's Linux toolchain is not in mise: clang, cmake,
      # ninja, pkg-config and the GTK 3 headers come from the runner image's
      # own Ubuntu archive (the list of the Flutter Linux setup page,
      # docs.flutter.dev/platform-integration/linux/setup, checked
      # 2026-11-10). Nothing else is installed or downloaded here. It runs
      # before `check` because `demo:test` already runs the build hook of the
      # demo's pty package (flutter_pty2), which compiles C with
      # native_toolchain_c and on Linux looks only for clang. macOS uses
      # Xcode's clang and Windows MSVC, both in the runner images.
      - name: Install the Linux desktop toolchain (apt)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # The runner image points apt at Azure's regional Ubuntu mirror,
          # which stalls or stops resolving from time to time
          # (actions/runner-images #6894, #7048; three failed runs on
          # 2026-11-11). Use the canonical archive instead.
          sudo grep -rlF azure.archive.ubuntu.com /etc/apt | xargs -r sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g'
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Check
        run: mise run check

      # Linux only: the demo app's release build (flutter_pty2's C library
      # and the GTK runner).
      - name: Build the demo for Linux
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: mise run demo:build-linux

  # Linux only: the score and the archive do not depend on the runner OS.
  # Needs network (pana resolves dependencies and clones `repository`), but no
  # native build: pana never runs build hooks.
  pana:
    name: pana and publish dry run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (mise.toml, verified against mise.lock)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        # Installing takes 15-80 s; a stalled download (seen once, 30 min) fails fast.
        timeout-minutes: 10
        with:
          version: 2026.11.2 # keep in sync with the other workflows (checked by test:release)
          cache: true

      - name: Locate pub cache
        run: echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-pana-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'tool/pana/pubspec.lock') }}

      - name: Resolve dependencies
        run: mise run deps

      # pana turns pubspec `screenshots` into WebP with libwebp's tools
      # (ghostty_dart_flutter has one); pub.dev's analyzer has them too. From
      # the runner image's Ubuntu archive, nothing else is installed.
      - name: Install libwebp tools (apt)
        timeout-minutes: 5
        run: |
          # The runner image points apt at Azure's regional Ubuntu mirror,
          # which stalls or stops resolving from time to time
          # (actions/runner-images #6894, #7048; three failed runs on
          # 2026-11-11). Use the canonical archive instead.
          sudo grep -rlF azure.archive.ubuntu.com /etc/apt | xargs -r sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g'
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends webp

      - name: Score with pana (160/160 required, every package)
        run: mise run pana

      # Warnings fail, hints do not (mise.toml, publish:dry-run). Both
      # packages: ghostty_dart and ghostty_dart_flutter.
      - name: Publish dry run
        run: mise run publish:dry-run

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # gitleaks v8.30.1 (released 2026-03-21), official linux x64 release
      # binary. The sha256 is pinned here and must also match the release's
      # checksums file; any mismatch fails the job.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for `gitleaks git`
          persist-credentials: false

      - name: Install gitleaks (verified)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir/bin"
          cd "$dir"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL --proto '=https' "$base/$tarball" -o "$tarball"
          curl -sSfL --proto '=https' "$base/$sums" -o "$sums"
          listed="$(awk -v f="$tarball" '$2 == f { print $1 }' "$sums")"
          actual="$(sha256sum "$tarball" | cut -d' ' -f1)"
          [[ "$listed" == "$GITLEAKS_SHA256" ]] || { echo "::error::checksums file differs from pinned sha256"; exit 1; }
          [[ "$actual" == "$GITLEAKS_SHA256" ]] || { echo "::error::downloaded tarball differs from pinned sha256"; exit 1; }
          tar -xzf "$tarball" -C bin gitleaks
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Scan full git history
        run: gitleaks git --redact --verbose --exit-code 1 .

      - name: Scan working tree
        run: gitleaks dir --redact --verbose --exit-code 1 .
