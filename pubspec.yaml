name: ghostty_dart_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/ghostty_dart
  - packages/ghostty_dart_flutter
  - packages/ghostty_dart_xterm
  - benchmarks
  - benchmarks/widget
  - apps/demo

hooks:
  user_defines:
    ghostty_dart:
      # Local development: the host build staged by `mise run native:host`
      # (tool/native/build_host.sh). A directory: the hook picks the library
      # for the target OS inside it, so this works on Linux, macOS and Windows.
      source: path
      path: .native-cache/host/

dev_dependencies:
  # tool/xterm_compat (COMPATIBILITY.md generator): both already locked as
  # transitive dependencies (analyzer is a dev dependency of ghostty_dart,
  # crypto comes with it), so declaring them adds no package to pubspec.lock.
  analyzer: ^13.3.0
  crypto: ^3.0.8
  lints: ^6.1.0
