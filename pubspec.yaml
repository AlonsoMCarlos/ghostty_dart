name: ghostty_dart_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/ghostty_dart

hooks:
  user_defines:
    ghostty_dart:
      # Local development: the host build staged by `mise run native:host`
      # (tool/native/build_host.sh). A directory: the hook picks the library
      # for the target OS inside it, so this works on Linux, macOS and Windows.
      source: path
      path: .native-cache/host/

dev_dependencies:
  lints: ^6.1.0

# Supply-chain cooldown (AGENTS.md): hold back versions published < 3 days ago.
# Remove each entry once it has aged; never applies to published packages.
dependency_overrides:
  code_assets: 2.1.0        # 2.2.0 published 2026-11-06
  native_toolchain_c: 0.19.5 # 0.19.6 published 2026-11-06
