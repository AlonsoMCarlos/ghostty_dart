# Project toolchain. `mise install` gives every contributor the same tools.
# Versions are exact and recorded with checksums in mise.lock.

[settings]
# Supply-chain cooldown: never install a tool version published < 3 days ago.
minimum_release_age = "3d"
lockfile = true

[tools]
flutter = "3.47.9"     # bundles Dart 3.13.x
zig = "0.17.1"         # libghostty-vt 1.x requires Zig 0.17.x exactly
minisign = "0.12"      # verifies upstream libghostty-vt release signatures
jq = "1.8.2"           # reads native/*.json in tool/native/*.sh
actionlint = "1.7.12"  # lints .github/workflows/ (lint:ci)
shellcheck = "0.11.0"  # lints tool/native/*.sh (lint:ci)

[env]
# Zig's global cache can break libghostty-vt builds when reused; keep it in-repo.
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-cache-global"
# ffigen (bindings generation only). Debian/Ubuntu: apt install libclang-19-dev.
LIBCLANG_PATH = "/usr/lib/llvm-19/lib/libclang.so"

# Standard entry points: `mise run <task>` (alias `mise <task>`).
# Native tasks are bash scripts; `shell` makes them run under Git Bash on Windows.
[tasks."native:fetch"]
description = "Download and verify the pinned libghostty-vt release files"
shell = "bash -c"
run = "bash tool/native/fetch_upstream.sh"

[tasks."native:build"]
description = "Build libghostty-vt offline for a Zig target (default: host Linux x64)"
usage = 'arg "[target]" default="x86_64-linux-gnu"'
shell = "bash -c"
run = "bash tool/native/build.sh ${usage_target?}"

[tasks."native:host"]
description = "Build libghostty-vt for this machine and stage it in .native-cache/host/ (used by the root pubspec)"
shell = "bash -c"
run = "bash tool/native/build_host.sh"

# Prebuilt release pipeline (ADR 0008): .github/workflows/native-*.yml runs
# exactly these tasks, so every workflow step can be reproduced locally.
[tasks."native:release-asset"]
description = "Build one prebuilt release asset by its ADR 0008 name -> .native-cache/release/<asset>"
usage = 'arg "<asset>" help="e.g. libghostty-vt-linux-x64.so (native/prebuilt_assets.json)"'
shell = "bash -c"
run = "bash tool/native/release_asset.sh ${usage_asset?}"

[tasks."native:check"]
description = "Check release assets: format, arch, exported API, dependencies, platform floors"
usage = '''
arg "[asset]" help="ADR 0008 asset name (or use --dist / --host)"
arg "[file]" help="binary to check (default: .native-cache/release/<asset>)"
flag "--dist <dir>" help="check every asset of the manifest in <dir>"
flag "--host" help="check the native:host build as this machine's asset"
'''
shell = "bash -c"
run = '''
if [[ -n "${usage_dist:-}" ]]; then bash tool/native/check_binary.sh --dist "$usage_dist"
elif [[ -n "${usage_host:-}" ]]; then bash tool/native/check_binary.sh --host
else bash tool/native/check_binary.sh "${usage_asset:?asset, --dist or --host}" ${usage_file:+"$usage_file"}
fi
'''

[tasks."native:dist"]
description = "Compare the a/b builds, assemble the release dir and write SHA256SUMS"
usage = '''
arg "<built>" help="downloaded build artifacts (native-<asset>-<a|b>/)"
arg "<dist>" help="new release directory"
arg "<buildinfo>" help="file for the builds' toolchain and image lines"
'''
shell = "bash -c"
run = 'bash tool/native/assemble_dist.sh "$usage_built" "$usage_dist" "$usage_buildinfo"'

[tasks."native:sums"]
description = "Verify a release dir against the canonical SHA256SUMS (exact set, bytes, hashes)"
usage = '''
arg "<dist>"
arg "<expected>" help="the SHA256SUMS exported by the verify job"
'''
shell = "bash -c"
run = 'bash tool/native/sums.sh verify "$usage_dist" "$usage_expected"'

[tasks."native:release-notes"]
description = "Print the Markdown release notes of a native release"
usage = '''
arg "<tag>"
arg "<dist>"
arg "<buildinfo>"
arg "<win_arm64>" help="outcome of the best-effort Windows arm64 smoke test"
arg "<run_url>"
'''
shell = "bash -c"
run = 'bash tool/native/release_notes.sh "$usage_tag" "$usage_dist" "$usage_buildinfo" "$usage_win_arm64" "$usage_run_url"'

[tasks."native:smoke"]
description = "Run the Dart test suite against one release asset from a release dir"
usage = '''
arg "<asset>"
arg "<dist>"
arg "<expected>" help="the SHA256SUMS exported by the verify job"
'''
shell = "bash -c"
run = 'bash tool/native/smoke.sh "$usage_asset" "$usage_dist" "$usage_expected"'

[tasks."native:matrix"]
description = "Print the CI matrices derived from native/prebuilt_assets.json"
shell = "bash -c"
run = "bash tool/native/matrix.sh"

[tasks."native:validate-ref"]
description = "Decide whether a native-release run publishes and validate its tag (env: EVENT, REF_TYPE, REF_NAME, PUBLISH_INPUT)"
shell = "bash -c"
run = "bash tool/native/validate_ref.sh"

[tasks."native:sums-output"]
description = "Export a release dir's SHA256SUMS as GitHub job outputs (sums, sha256)"
usage = 'arg "<dist>"'
shell = "bash -c"
run = 'bash tool/native/sums.sh output "$usage_dist"'

[tasks."native:publish"]
description = "Publish a verified release dir as a GitHub release via a draft (needs GH_TOKEN, GITHUB_REPOSITORY)"
usage = '''
arg "<tag>"
arg "<dist>"
arg "<notes>"
'''
shell = "bash -c"
run = 'bash tool/native/publish_release.sh "$usage_tag" "$usage_dist" "$usage_notes"'

[tasks."native:ndk"]
description = "Verify the pinned Android NDK (sha256 + sha1) and extract its sysroot into a new dir"
usage = 'arg "<dest>"'
shell = "bash -c"
run = 'bash tool/native/fetch_ndk.sh "$usage_dest"'

[tasks."native:dart-sdk"]
description = "Verify and extract the pinned Dart SDK (for runners without Flutter); prints its bin dir"
usage = '''
arg "<platform>" help="linux-x64 | linux-arm64 | windows-arm64"
arg "<dest>"
'''
shell = "bash -c"
run = 'bash tool/native/fetch_dart_sdk.sh "$usage_platform" "$usage_dest"'

[tasks."deps:no-flutter"]
description = "Resolve the workspace with plain Dart (no benchmarks member), failing on any change from pubspec.lock"
shell = "bash -c"
run = "bash tool/native/pub_get_without_flutter.sh"

[tasks."native:pin"]
description = "Pin a native release into prebuilt.dart, verifying its attestations (--no-verify: tests only)"
usage = '''
arg "<tag>" help="native-v<version>-r<n>"
flag "--no-verify" help="skip every verification (tests only)"
flag "--sums <path>" help="local SHA256SUMS; requires --no-verify"
flag "--file <path>" help="prebuilt.dart to rewrite"
'''
shell = "bash -c"
run = '''
dart tool/native/pin_prebuilt.dart "$usage_tag" ${usage_no_verify:+--no-verify} \
  ${usage_sums:+--sums "$usage_sums"} ${usage_file:+--file "$usage_file"}
'''

[tasks."test:tool"]
description = "Test the release tools (binary checker, pin logic, asset manifest)"
run = "dart tool/native/test/tool_test.dart"

# The name is the one CI and the task list use; it covers workflows and the
# native shell scripts alike.
[tasks."lint:ci"]
description = "Lint the GitHub workflows (actionlint, which also shellchecks run: blocks) and tool/native/*.sh"
shell = "bash -c"
run = ["actionlint", "shellcheck -x tool/native/*.sh"]

[tasks.ffigen]
description = "Regenerate the FFI bindings from the libghostty-vt headers (needs libclang)"
depends = ["native:host"]
run = "dart run packages/ghostty_dart/tool/ffigen.dart"

[tasks.deps]
description = "Resolve workspace dependencies exactly as locked in pubspec.lock"
run = "flutter pub get --enforce-lockfile"

[tasks.format]
description = "Format all Dart code"
run = "dart format ."

[tasks.analyze]
description = "Check formatting and static analysis"
run = ["dart format -o none --set-exit-if-changed .", "dart analyze --fatal-infos"]

[tasks.test]
description = "Run all tests"
# Run inside the package: `dart test <dir>` from the workspace root does not
# run the package's build hook, so the native library would be missing.
dir = "{{config_root}}/packages/ghostty_dart"
run = "dart test"

[tasks.cooldown]
description = "Fail if any locked dependency was published less than 3 days ago"
run = "dart run tool/check_cooldown.dart"

[tasks."bench:parser"]
description = "Parser throughput benchmark vs xterm 4.0.0 and xterm2_core, JIT and AOT (options: see benchmarks/README.md)"
dir = "{{config_root}}/benchmarks"
run = "dart run bin/parser_bench.dart"

[tasks.check]
description = "Everything CI runs locally"
depends = ["analyze", "test", "test:tool", "cooldown", "lint:ci"]
