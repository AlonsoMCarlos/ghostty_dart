# Project toolchain. `mise install` gives every contributor the same tools.
# Versions are exact and recorded with checksums in mise.lock.

[settings]
# Supply-chain cooldown: never install a tool version published < 3 days ago.
minimum_release_age = "3d"
lockfile = true

[tools]
flutter = "3.47.9"     # bundles Dart 3.13.x
zig = "0.17.1"         # libghostty-vt 1.x requires Zig 0.17.x exactly
minisign = "0.12"      # verifies upstream libghostty-vt release signatures
jq = "1.8.2"           # reads native/*.json in tool/native/*.sh
actionlint = "1.7.12"  # lints .github/workflows/ (lint:ci)
shellcheck = "0.11.0"  # lints the repo's shell scripts (lint:ci)

[env]
# Zig's global cache can break libghostty-vt builds when reused; keep it in-repo.
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-cache-global"
# ffigen (bindings generation only). Debian/Ubuntu: apt install libclang-19-dev.
LIBCLANG_PATH = "/usr/lib/llvm-19/lib/libclang.so"

# Standard entry points: `mise run <task>` (alias `mise <task>`).
# Native tasks are bash scripts; `shell` makes them run under Git Bash on Windows.
[tasks."native:fetch"]
description = "Download and verify the pinned libghostty-vt release files"
shell = "bash -c"
run = "bash tool/native/fetch_upstream.sh"

[tasks."native:build"]
description = "Build libghostty-vt offline for a Zig target (default: host Linux x64)"
usage = 'arg "[target]" default="x86_64-linux-gnu"'
shell = "bash -c"
run = "bash tool/native/build.sh ${usage_target?}"

[tasks."native:host"]
description = "Build libghostty-vt for this machine and stage it in .native-cache/host/ (used by the root pubspec)"
shell = "bash -c"
run = "bash tool/native/build_host.sh"

# Every task that runs ghostty_dart's build hook through the root pubspec's
# `source: path` depends on this: on a fresh clone it stops with "run `mise
# run native:host` first" instead of Flutter's bare "Building native assets
# failed".
[tasks."native:require-host"]
description = "Fail fast with the fix when .native-cache/host/ lacks the library the root pubspec builds with"
shell = "bash -c"
run = "bash tool/native/require_host.sh"

# Prebuilt release pipeline (ADR 0008): .github/workflows/native-*.yml runs
# exactly these tasks, so every workflow step can be reproduced locally.
[tasks."native:release-asset"]
description = "Build one prebuilt release asset by its ADR 0008 name -> .native-cache/release/<asset>"
usage = 'arg "<asset>" help="e.g. libghostty-vt-linux-x64.so (native/prebuilt_assets.json)"'
shell = "bash -c"
run = "bash tool/native/release_asset.sh ${usage_asset?}"

[tasks."native:check"]
description = "Check release assets: format, arch, exported API, dependencies, platform floors"
usage = '''
arg "[asset]" help="ADR 0008 asset name (or use --dist / --host)"
arg "[file]" help="binary to check (default: .native-cache/release/<asset>)"
flag "--dist <dir>" help="check every asset of the manifest in <dir>"
flag "--host" help="check the native:host build as this machine's asset"
'''
shell = "bash -c"
run = '''
if [[ -n "${usage_dist:-}" ]]; then bash tool/native/check_binary.sh --dist "$usage_dist"
elif [[ -n "${usage_host:-}" ]]; then bash tool/native/check_binary.sh --host
else bash tool/native/check_binary.sh "${usage_asset:?asset, --dist or --host}" ${usage_file:+"$usage_file"}
fi
'''

[tasks."native:dist"]
description = "Compare the a/b builds, assemble the release dir and write SHA256SUMS"
usage = '''
arg "<built>" help="downloaded build artifacts (native-<asset>-<a|b>/)"
arg "<dist>" help="new release directory"
arg "<buildinfo>" help="file for the builds' toolchain and image lines"
'''
shell = "bash -c"
run = 'bash tool/native/assemble_dist.sh "$usage_built" "$usage_dist" "$usage_buildinfo"'

[tasks."native:sums"]
description = "Verify a release dir against the canonical SHA256SUMS (exact set, bytes, hashes)"
usage = '''
arg "<dist>"
arg "<expected>" help="the SHA256SUMS exported by the verify job"
'''
shell = "bash -c"
run = 'bash tool/native/sums.sh verify "$usage_dist" "$usage_expected"'

[tasks."native:release-notes"]
description = "Print the Markdown release notes of a native release"
usage = '''
arg "<tag>"
arg "<dist>"
arg "<buildinfo>"
arg "<win_arm64>" help="outcome of the best-effort Windows arm64 smoke test"
arg "<run_url>"
'''
shell = "bash -c"
run = 'bash tool/native/release_notes.sh "$usage_tag" "$usage_dist" "$usage_buildinfo" "$usage_win_arm64" "$usage_run_url"'

[tasks."native:smoke"]
description = "Run the Dart test suite against one release asset from a release dir"
usage = '''
arg "<asset>"
arg "<dist>"
arg "<expected>" help="the SHA256SUMS exported by the verify job"
'''
shell = "bash -c"
run = 'bash tool/native/smoke.sh "$usage_asset" "$usage_dist" "$usage_expected"'

[tasks."native:matrix"]
description = "Print the CI matrices derived from native/prebuilt_assets.json"
shell = "bash -c"
run = "bash tool/native/matrix.sh"

[tasks."native:validate-ref"]
description = "Decide whether a native-release run publishes and validate its tag (env: EVENT, REF_TYPE, REF_NAME, PUBLISH_INPUT)"
shell = "bash -c"
run = "bash tool/native/validate_ref.sh"

[tasks."native:sums-output"]
description = "Export a release dir's SHA256SUMS as GitHub job outputs (sums, sha256)"
usage = 'arg "<dist>"'
shell = "bash -c"
run = 'bash tool/native/sums.sh output "$usage_dist"'

[tasks."native:publish"]
description = "Publish a verified release dir as a GitHub release via a draft (needs GH_TOKEN, GITHUB_REPOSITORY)"
usage = '''
arg "<tag>"
arg "<dist>"
arg "<notes>"
'''
shell = "bash -c"
run = 'bash tool/native/publish_release.sh "$usage_tag" "$usage_dist" "$usage_notes"'

[tasks."native:ndk"]
description = "Verify the pinned Android NDK (sha256 + sha1) and extract its sysroot into a new dir"
usage = 'arg "<dest>"'
shell = "bash -c"
run = 'bash tool/native/fetch_ndk.sh "$usage_dest"'

[tasks."native:dart-sdk"]
description = "Verify and extract the pinned Dart SDK (for runners without Flutter); prints its bin dir"
usage = '''
arg "<platform>" help="linux-x64 | linux-arm64 | windows-arm64"
arg "<dest>"
'''
shell = "bash -c"
run = 'bash tool/native/fetch_dart_sdk.sh "$usage_platform" "$usage_dest"'

[tasks."deps:no-flutter"]
description = "Resolve the workspace with plain Dart (no Flutter members: benchmarks, benchmarks/widget, apps/demo, ghostty_dart_flutter, ghostty_dart_xterm), failing on any change from pubspec.lock"
shell = "bash -c"
run = "bash tool/native/pub_get_without_flutter.sh"

[tasks."native:pin"]
description = "Pin a native release into prebuilt.dart, verifying its attestations (--no-verify: tests only)"
usage = '''
arg "<tag>" help="native-v<version>-r<n>"
flag "--no-verify" help="skip every verification (tests only)"
flag "--sums <path>" help="local SHA256SUMS; requires --no-verify"
flag "--file <path>" help="prebuilt.dart to rewrite"
'''
shell = "bash -c"
run = '''
dart tool/native/pin_prebuilt.dart "$usage_tag" ${usage_no_verify:+--no-verify} \
  ${usage_sums:+--sums "$usage_sums"} ${usage_file:+--file "$usage_file"}
'''

[tasks."test:tool"]
description = "Test the repo tools (binary checker, pin logic, asset manifest, cooldown lock parsing, translation check, analysis options sync, repo hygiene, xterm compat generator, licence notices)"
run = [
  "dart tool/native/test/tool_test.dart",
  "dart tool/test/check_cooldown_test.dart",
  "dart tool/test/check_translations_test.dart",
  "dart tool/test/analysis_options_test.dart",
  "dart tool/test/repo_hygiene_test.dart",
  "dart tool/test/xterm_compat_test.dart",
  "dart tool/test/notices_test.dart",
]

# The name is the one CI and the task list use; it covers workflows and the
# repo's shell scripts alike.
[tasks."lint:ci"]
description = "Lint the GitHub workflows (actionlint, which also shellchecks run: blocks) and every shell script under tool/"
shell = "bash -c"
run = [
  "actionlint",
  "shellcheck -x tool/*.sh tool/native/*.sh tool/pana/*.sh tool/release/*.sh tool/release/test/*.sh",
]

[tasks.ffigen]
description = "Regenerate the FFI bindings from the libghostty-vt headers (needs libclang)"
depends = ["native:host"]
run = "dart run packages/ghostty_dart/tool/ffigen.dart"

[tasks.deps]
description = "Resolve workspace dependencies exactly as locked in pubspec.lock"
run = "flutter pub get --enforce-lockfile"

[tasks.format]
description = "Format all Dart code"
run = "dart format ."

[tasks.analyze]
description = "Check formatting and static analysis"
run = ["dart format -o none --set-exit-if-changed .", "dart analyze --fatal-infos"]

[tasks.test]
description = "Run all tests"
depends = ["native:require-host"]
# Run inside the package: `dart test <dir>` from the workspace root does not
# run the package's build hook, so the native library would be missing.
dir = "{{config_root}}/packages/ghostty_dart"
run = "dart test"

# The Flutter widget package: `flutter test` runs the build hook too.
# Spikes on unpinned host fonts are tagged `spike` and left out.
[tasks."test:flutter"]
description = "Run the ghostty_dart_flutter tests (flutter test, without the spike tag)"
depends = ["native:require-host"]
dir = "{{config_root}}/packages/ghostty_dart_flutter"
run = "flutter test --exclude-tags spike"

# The xterm 4.0.0 compatible adapter (ADR 0013); `flutter test` runs the
# ghostty_dart build hook as for the widget package.
[tasks."test:xterm"]
description = "Run the ghostty_dart_xterm tests (flutter test)"
depends = ["native:require-host"]
dir = "{{config_root}}/packages/ghostty_dart_xterm"
run = "flutter test"

[tasks."test:goldens:update"]
description = "Regenerate the ghostty_dart_flutter goldens and the doc/screenshot.png of ghostty_dart_flutter and ghostty_dart_xterm (Linux only; review the image diff)"
depends = ["native:require-host"]
dir = "{{config_root}}/packages"
# The `golden` tag skips every golden off Linux, so elsewhere this would
# "succeed" and update nothing: fail loudly instead. The adapter's only
# golden is its pub.dev screenshot (test/screenshot/).
shell = "bash -c"
run = '''
set -e
[ "$(uname -s)" = Linux ] || { echo "error: goldens are rendered on Linux only (ADR 0011)" >&2; exit 1; }
(cd ghostty_dart_flutter && flutter test --update-goldens --tags golden)
(cd ghostty_dart_xterm && flutter test --update-goldens --tags golden)
'''

[tasks."test:spike"]
description = "Run the ghostty_dart_flutter measurement spikes (unpinned host fonts; manual, not in CI)"
depends = ["native:require-host"]
dir = "{{config_root}}/packages/ghostty_dart_flutter"
run = "flutter test --tags spike"

# Demo app (apps/demo, ADR 0011): flutter_pty2 on desktop, a fake shell in
# Dart on the web. flutter_pty2's build hook compiles its C already for
# demo:test, so every demo task needs a C compiler (clang on Linux, Xcode on
# macOS, MSVC on Windows). Linux desktop builds need clang, cmake, ninja-build,
# pkg-config, libgtk-3-dev and libstdc++-12-dev (Debian 13: the -14 one that
# g++ brings) from the distribution.
[tasks."demo:test"]
description = "Run the demo app tests (fake shell, app wiring, pty shell with a fake session)"
depends = ["native:require-host"]
dir = "{{config_root}}/apps/demo"
run = "flutter test"

# A real shell in a real pty, in the built app (integration_test). Needs a
# display: on a headless Linux machine run it under xvfb-run. Not in CI or
# `check`: demo:test covers the wiring with fakes.
[tasks."demo:integration"]
description = "Run the demo against a real pty on a desktop device (default: linux; needs a display)"
depends = ["native:require-host"]
usage = 'arg "[device]" default="linux" help="flutter device id: linux, macos, windows"'
dir = "{{config_root}}/apps/demo"
shell = "bash -c"
run = 'flutter test integration_test -d "$usage_device"'

[tasks."demo:run"]
description = "Run the demo on a device (default: linux); --fake uses the web's fake shell"
depends = ["native:require-host"]
usage = '''
arg "[device]" default="linux" help="flutter device id: linux, macos, windows, chrome"
flag "--fake" help="use the fake shell instead of a pty (--dart-define=DEMO_SHELL=fake)"
'''
dir = "{{config_root}}/apps/demo"
shell = "bash -c"
run = 'flutter run -d "$usage_device" ${usage_fake:+--dart-define=DEMO_SHELL=fake}'

[tasks."demo:build-linux"]
description = "Build the demo for Linux desktop (release)"
depends = ["native:require-host"]
dir = "{{config_root}}/apps/demo"
run = "flutter build linux"

# The live demo needs ghostty_dart's wasm backend (ADR 0011), which does not
# exist yet: until lib/ghostty_dart.dart exports one under
# `dart.library.js_interop`, stop with that message instead of dart2wasm's
# wall of dart:ffi errors.
[tasks."demo:build-web"]
description = "Build the demo for the web with WebAssembly (needs ghostty_dart's wasm backend, not implemented yet)"
dir = "{{config_root}}/apps/demo"
shell = "bash -c"
run = '''
if ! grep -q "dart.library.js_interop" ../../packages/ghostty_dart/lib/ghostty_dart.dart; then
  echo "error: the web demo needs ghostty_dart's wasm backend, not implemented yet (ADR 0011)" >&2
  exit 1
fi
flutter build web --wasm
'''

# Frame-time benchmark of the widget against xterm 4.0.0 and xterm2 5.4.0
# (benchmarks/widget, benchmarks/README.md). Needs a display (xvfb-run on a
# headless Linux machine) and the JetBrains Mono test fonts of
# ghostty_dart_flutter.
[tasks."bench:widget:test"]
description = "Test the frame benchmark harness headlessly (streams, report, same screen on every widget)"
depends = ["native:require-host"]
dir = "{{config_root}}/benchmarks/widget"
run = "flutter test"

[tasks."bench:widget"]
description = "Frame-time benchmark (flutter drive --profile) of 4 widgets x 6 scenarios x N passes -> benchmarks/widget/build/widget_bench.md"
depends = ["native:require-host"]
usage = '''
arg "[device]" default="linux" help="desktop device id: linux or macos"
flag "--frames <n>" default="300" help="traced frames per run"
flag "--passes <n>" default="3" help="passes over every scenario and widget (widget order rotates)"
flag "--font-size <px>" default="12" help="font size in logical px (smaller only if the display cannot hold the grid)"
flag "--renderer <renderer>" default="impeller" help="impeller or skia" {
  choices "impeller" "skia"
}
'''
dir = "{{config_root}}/benchmarks/widget"
shell = "bash -c"
run = '''
impeller=--enable-impeller
[[ "$usage_renderer" == skia ]] && impeller=--no-enable-impeller
flutter drive --profile -d "$usage_device" "$impeller" --endless-trace-buffer \
  --driver test_driver/perf_driver.dart \
  --target integration_test/frame_bench_test.dart \
  --dart-define=BENCH_FRAMES="$usage_frames" \
  --dart-define=BENCH_PASSES="$usage_passes" \
  --dart-define=BENCH_FONT_SIZE="$usage_font_size" \
  --dart-define=BENCH_RENDERER="$usage_renderer" \
  --dart-define=BENCH_OUT_DIR="{{config_root}}/benchmarks/widget/build" \
  --dart-define=BENCH_FONT_DIR="{{config_root}}/packages/ghostty_dart_flutter/test/fonts"
'''

# Firehose benchmark: `tree -C`-like output fed like a pty (4 KiB chunks,
# 256 KiB window, fixed rate) with and without the view; reports process
# CPU time per MB, frames and memory. Needs a display (xvfb-run on headless
# Linux).
[tasks."bench:firehose"]
description = "Firehose benchmark (profile build): CPU per MB of tree-like output fed like a pty, with and without the view"
usage = '''
flag "--mb <n>" default="40" help="MB of output per run"
flag "--rate <kBps>" default="7000" help="output rate in kB/s (0: unlimited)"
flag "--runs <n>" default="3" help="runs per configuration"
flag "--configs <list>" default="no view,blank,view" help="configurations to run, comma-separated (no view, blank, view)"
flag "--pacing <list>" default="smooth,balanced" help="VtFloodPacing policies the blank and view configurations run with, comma-separated"
'''
dir = "{{config_root}}/benchmarks/widget"
shell = "bash -c"
run = '''
set -euo pipefail
case "$(uname -s)" in
  Linux) device=linux ;;
  *) echo "bench:firehose reads /proc: Linux only" >&2; exit 1 ;;
esac
flutter build "$device" --profile -t lib/firehose_main.dart \
  --dart-define=FIREHOSE_MB="$usage_mb" \
  --dart-define=FIREHOSE_RATE="$usage_rate" \
  --dart-define=FIREHOSE_RUNS="$usage_runs" \
  --dart-define=FIREHOSE_CONFIGS="$usage_configs" \
  --dart-define=FIREHOSE_PACING="$usage_pacing" \
  --dart-define=BENCH_FONT_DIR="{{config_root}}/packages/ghostty_dart_flutter/test/fonts"
build/linux/*/profile/bundle/ghostty_dart_widget_benchmarks | grep '^FIREHOSE'
'''

# Attribution benchmark: the same tree-like stream through a real pty child
# (flutter_pty2), then the controller, then a blank Flutter frame, then the
# view; prints a table of CPU per MB per layer and thread for each variant
# (renderer:scale:window). `--pty fork` (or both) also measures the
# maintainer's flutter_pty2 fork at a pinned commit through a temporary,
# never committed root pubspec_overrides.yaml; pubspec.lock is restored on
# exit. Linux only (reads /proc); needs a display (xvfb-run on headless
# Linux, where llvmpipe makes the GPU side unrealistic).
[tasks."bench:attribution"]
description = "Attribution benchmark (profile build): CPU per MB of a tree-like flood through a real pty, layer by layer (pty, parser, blank frame, view)"
depends = ["native:require-host"]
usage = '''
flag "--mb <n>" default="65" help="MB of fixture (tree ~ on the maintainer's machine: 65.5 MB)"
flag "--rate <kBps>" default="7000" help="the child's output rate in kB/s (0: plain cat, as fast as the terminal takes it)"
flag "--runs <n>" default="3" help="runs per configuration"
flag "--layers <list>" default="pty,parser,blank,view" help="layers, comma-separated"
flag "--pacing <list>" default="smooth,balanced" help="VtFloodPacing policies of the blank and view layers"
flag "--variants <list>" default="impeller:2:1800x1100,skia:2:1800x1100,impeller:1:1800x1100,impeller:2:900x550,impeller:2:1800x1100:x11,impeller:2:1800x1100:uithread" help="renderer:GDK_SCALE:window logical size[:options], comma-separated; options joined by +: x11 or wayland (GDK_BACKEND), uithread (UI isolate on its own thread)"
flag "--pty <which>" default="both" help="flutter_pty2 build: upstream (3.0.0), fork (pinned commit, first variant only) or both" {
  choices "upstream" "fork" "both"
}
'''
dir = "{{config_root}}/benchmarks/widget"
shell = "bash -c"
run = '''
set -euo pipefail
[[ "$(uname -s)" == Linux ]] || { echo "bench:attribution reads /proc: Linux only" >&2; exit 1; }
# The maintainer's fork: batched pty reads (SoFluffyOS/flutter_pty2#3).
fork_url=https://github.com/AlonsoMCarlos/flutter_pty2.git
fork_ref=f25158183a7d22307e37581e3d534a62a80dc916
root="{{config_root}}"
fixture="$PWD/build/attribution/tree-${usage_mb}MB.txt"
[[ -f "$fixture" ]] || dart tool/attribution_fixture.dart "$fixture" "$usage_mb"
build() {
  flutter build linux --profile -t lib/attribution_main.dart \
    --dart-define=BENCH_FONT_DIR="$root/packages/ghostty_dart_flutter/test/fonts" >&2
}
run_variants() { # <pty label> <variant>...
  local pty="$1"; shift
  local spec renderer scale size options option
  for spec in "$@"; do
    IFS=: read -r renderer scale size options <<<"$spec"
    local switches=()
    [[ "$renderer" == skia ]] && switches=(FLUTTER_ENGINE_SWITCHES=1 FLUTTER_ENGINE_SWITCH_1=enable-impeller=false)
    for option in ${options//+/ }; do
      case "$option" in
        x11|wayland) switches+=(GDK_BACKEND="$option") ;;
        uithread) switches+=(BENCH_UI_THREAD=separate) ;;
        *) echo "unknown variant option: $option" >&2; exit 2 ;;
      esac
    done
    echo "== $spec, $pty" >&2
    env "${switches[@]}" GDK_SCALE="$scale" BENCH_WINDOW_SIZE="$size" \
      ATTRIBUTION_FIXTURE="$fixture" ATTRIBUTION_DART="$(command -v dart)" \
      ATTRIBUTION_PACER="$PWD/tool/paced_cat.dart" ATTRIBUTION_RATE="$usage_rate" \
      ATTRIBUTION_RUNS="$usage_runs" ATTRIBUTION_LAYERS="$usage_layers" \
      ATTRIBUTION_PACING="$usage_pacing" \
      ATTRIBUTION_VARIANT="$renderer, GDK_SCALE=$scale, $size${options:+, $options}, $pty" \
      build/linux/*/profile/bundle/ghostty_dart_widget_benchmarks \
      | grep '^ATTRIBUTION' | sed 's/^ATTRIBUTION_TABLE //' \
      || echo "warning: variant $spec failed" >&2
  done
}
IFS=, read -r -a variants <<<"$usage_variants"
if [[ "$usage_pty" != fork ]]; then
  build
  run_variants "flutter_pty2 3.0.0" "${variants[@]}"
fi
if [[ "$usage_pty" != upstream ]]; then
  if [[ -e "$root/pubspec_overrides.yaml" ]]; then
    echo "error: $root/pubspec_overrides.yaml exists; move it away to measure the fork" >&2
    exit 1
  fi
  saved="$(mktemp -d)"
  cp "$root/pubspec.lock" "$saved/pubspec.lock"
  restored=
  restore() {
    [[ -z "$restored" ]] || return 0
    restored=1
    rm -f "$root/pubspec_overrides.yaml"
    cp "$saved/pubspec.lock" "$root/pubspec.lock"
    (cd "$root" && flutter pub get --enforce-lockfile >/dev/null)
    rm -rf "$saved"
  }
  trap restore EXIT
  trap 'exit 130' INT TERM
  printf 'dependency_overrides:\n  flutter_pty2:\n    git:\n      url: %s\n      ref: %s\n' \
    "$fork_url" "$fork_ref" >"$root/pubspec_overrides.yaml"
  (cd "$root" && flutter pub get >/dev/null)
  # Only flutter_pty2's entry may change: drop it from both locks and compare.
  strip() { awk '/^  flutter_pty2:$/{skip=1; next} skip && /^  [^ ]/{skip=0} !skip' "$1"; }
  if ! diff <(strip "$saved/pubspec.lock") <(strip "$root/pubspec.lock") >&2; then
    echo "error: the fork changed other locked packages" >&2
    exit 1
  fi
  build
  run_variants "flutter_pty2 fork ${fork_ref:0:7}" "${variants[0]}"
fi
'''

# Where the time of one attribution layer goes: runs it once with the VM
# service on and samples the UI isolate's Dart CPU profile mid-flood
# (tool/cpu_profile.dart); with --perf, also `perf record -g` of the main
# thread (UI isolate + GTK present), when perf is installed.
[tasks."bench:attribution:profile"]
description = "Dart CPU profile (and optionally perf) of one attribution layer mid-flood"
depends = ["native:require-host"]
usage = '''
flag "--layer <layer>" default="view" help="pty, parser, blank or view"
flag "--pacing <pacing>" default="smooth" help="VtFloodPacing of blank and view"
flag "--variant <spec>" default="impeller:2:1800x1100" help="renderer:GDK_SCALE:window logical size"
flag "--mb <n>" default="65" help="MB of fixture"
flag "--rate <kBps>" default="7000" help="the child's output rate in kB/s"
flag "--seconds <n>" default="5" help="seconds sampled, from 3 s after start"
flag "--perf" help="also perf record -g the main thread (needs perf and perf_event_paranoid <= 1)"
'''
dir = "{{config_root}}/benchmarks/widget"
shell = "bash -c"
run = '''
set -euo pipefail
root="{{config_root}}"
fixture="$PWD/build/attribution/tree-${usage_mb}MB.txt"
[[ -f "$fixture" ]] || dart tool/attribution_fixture.dart "$fixture" "$usage_mb"
flutter build linux --profile -t lib/attribution_main.dart \
  --dart-define=BENCH_FONT_DIR="$root/packages/ghostty_dart_flutter/test/fonts" >&2
IFS=: read -r renderer scale size <<<"$usage_variant"
rm -f build/attribution/perf.data
port=8181
switches=(FLUTTER_ENGINE_SWITCH_1=vm-service-port=$port FLUTTER_ENGINE_SWITCH_2=disable-service-auth-codes)
if [[ "$renderer" == skia ]]; then
  switches+=(FLUTTER_ENGINE_SWITCHES=3 FLUTTER_ENGINE_SWITCH_3=enable-impeller=false)
else
  switches+=(FLUTTER_ENGINE_SWITCHES=2)
fi
env "${switches[@]}" GDK_SCALE="$scale" BENCH_WINDOW_SIZE="$size" \
  ATTRIBUTION_FIXTURE="$fixture" ATTRIBUTION_DART="$(command -v dart)" \
  ATTRIBUTION_PACER="$PWD/tool/paced_cat.dart" ATTRIBUTION_RATE="$usage_rate" \
  ATTRIBUTION_RUNS=1 ATTRIBUTION_LAYERS="$usage_layer" ATTRIBUTION_PACING="$usage_pacing" \
  ATTRIBUTION_VARIANT="$usage_variant, profile of $usage_layer $usage_pacing" \
  build/linux/*/profile/bundle/ghostty_dart_widget_benchmarks >build/attribution/profile-app.log 2>&1 &
app=$!
if [[ "${usage_perf:-false}" == true ]] && command -v perf >/dev/null; then
  (sleep 3 && perf record -F 999 -g -t "$app" -o build/attribution/perf.data -- sleep "$usage_seconds" >&2) &
fi
dart tool/cpu_profile.dart "ws://127.0.0.1:$port/ws" "$usage_seconds" 3
wait
grep -h '^ATTRIBUTION {' build/attribution/profile-app.log
if [[ -f build/attribution/perf.data ]]; then
  perf report -i build/attribution/perf.data --no-children --sort dso,symbol \
    --percent-limit 0.7 --stdio 2>/dev/null | grep -v '^$' | grep -v '^#' | grep '%' | head -60
fi
'''

# The grid pixel check (ADR 0011) on the device's own renderer, which
# flutter_tester's software raster cannot show: glyphs of a 200-column row
# must land on the device-pixel grid under Impeller (or Skia) too. Needs a
# display, like bench:widget.
[tasks."test:grid-pixels"]
description = "Check on a desktop device that glyphs land on the device-pixel grid (200 columns, 4 DPRs x 3 sizes x 2 text paths)"
depends = ["native:require-host"]
usage = '''
arg "[device]" default="linux" help="desktop device id: linux or macos"
flag "--renderer <renderer>" default="impeller" help="impeller or skia" {
  choices "impeller" "skia"
}
'''
dir = "{{config_root}}/benchmarks/widget"
shell = "bash -c"
run = '''
impeller=--enable-impeller
[[ "$usage_renderer" == skia ]] && impeller=--no-enable-impeller
flutter drive -d "$usage_device" "$impeller" \
  --driver test_driver/integration_test.dart \
  --target integration_test/grid_pixel_test.dart \
  --dart-define=BENCH_FONT_DIR="{{config_root}}/packages/ghostty_dart_flutter/test/fonts"
'''

[tasks.cooldown]
description = "Fail if any locked dependency was published less than 3 days ago"
run = "dart run tool/check_cooldown.dart"

# pub.dev score (ADR 0010): the pinned pana of tool/pana/ on each package's
# publish archive. Needs network. Separate from `check` (see ci.yml's pana job).
[tasks.pana]
description = "Score the published packages with the pinned pana, as pub.dev does (each must be 160/160)"
usage = 'arg "[package]..." var=#true help="package dirs relative to the repo root (default: packages/ghostty_dart packages/ghostty_dart_flutter packages/ghostty_dart_xterm)"'
shell = "bash -c"
# usage passes variadic args as one shell-quoted string; `eval set --`
# splits it back into words without breaking a quoted path with spaces.
run = '''
eval "set -- ${usage_package:-}"
bash tool/pana/run_pana.sh "$@"
'''

# Fails on any pub validation warning (exit 65); hints do not fail it. While
# the root pubspec holds a cooldown `dependency_overrides` entry, pub prints
# the expected hint "Non-dev dependencies are overridden in
# ../../pubspec.yaml". A dirty git tree is a warning, so run it on committed
# changes.
[tasks."publish:dry-run"]
description = "Validate the publish archives of ghostty_dart, ghostty_dart_flutter and ghostty_dart_xterm (pub publish --dry-run); warnings fail"
dir = "{{config_root}}/packages"
run = [
  "cd ghostty_dart && dart pub publish --dry-run",
  "cd ghostty_dart_flutter && flutter pub publish --dry-run",
  "cd ghostty_dart_xterm && flutter pub publish --dry-run",
]

[tasks."bench:parser"]
description = "Parser throughput benchmark vs xterm 4.0.0 and xterm2_core, JIT and AOT (options: see benchmarks/README.md)"
depends = ["native:require-host"]
dir = "{{config_root}}/benchmarks"
run = "dart run bin/parser_bench.dart"

# Bilingual docs (AGENTS.md "Docs and language"): every X.es.md names the
# English blob it translates. Stale pairs print GitHub ::warning:: lines and
# exit 0; broken pairs exit 1.
[tasks."docs:translations"]
description = "Check that every Spanish doc translates the current English file"
run = "dart tool/check_translations.dart"

# Release pipeline (ADR 0010): publish.yml runs exactly these tasks.
# release-please.yml and dco.yml install no tools, so they call the scripts
# directly; release:ready, release:dispatch and dco mirror those steps.
[tasks."release:validate-tag"]
description = "Validate a publish ref: <package>-v<X.Y.Z> tag of an allow-listed package, on main, matching its pubspec and CHANGELOG (env: EVENT, REF_TYPE, REF_NAME)"
shell = "bash -c"
run = "bash tool/release/validate_tag.sh"

[tasks."release:package"]
description = "Write the publish archive of the package a release tag names, offline (dart pub publish --to-archive), and print its sha256"
usage = '''
arg "<tag>" help="<package>-v<X.Y.Z>"
arg "<archive>" help="output .tar.gz"
'''
shell = "bash -c"
run = 'bash tool/release/package.sh "$usage_tag" "$usage_archive"'

[tasks."release:check-archive"]
description = "Check a publish archive: sha256, pubspec name and version from the tag, no publish_to"
usage = '''
arg "<archive>"
arg "<sha256>" help="the package job's output"
arg "<tag>" help="<package>-v<X.Y.Z>"
'''
shell = "bash -c"
run = 'bash tool/release/check_archive.sh "$usage_archive" "$usage_sha256" "$usage_tag"'

[tasks."release:upload"]
description = "Mint the pub.dev OIDC token and upload a checked archive with the pinned Dart (GitHub Actions only; id-token: write)"
usage = 'arg "<archive>"'
shell = "bash -c"
run = 'bash tool/release/upload.sh "$usage_archive"'

[tasks."release:ready"]
description = "Print ready=true once every released package has a <package>-v<X.Y.Z> tag (release-please.yml's bootstrap gate)"
shell = "bash -c"
run = "bash tool/release/release_ready.sh"

[tasks."release:dispatch"]
description = "Dispatch publish.yml on a tag of main, or ci.yml and dco.yml on a release PR branch (needs GH_TOKEN, GH_REPO)"
usage = '''
arg "<what>" help="publish | pr"
arg "<ref>" help="<package>-v<X.Y.Z> tag, or a release-please branch"
'''
shell = "bash -c"
run = 'bash tool/release/dispatch.sh "$usage_what" "$usage_ref"'

[tasks.dco]
description = "Check that every non-merge commit in <base>..<head> is signed off by its author (DCO)"
usage = '''
arg "[base]" default="origin/main"
arg "[head]" default="HEAD"
'''
shell = "bash -c"
run = 'bash tool/check_dco.sh "$usage_base" "$usage_head"'

[tasks."test:release"]
description = "Test the DCO check and the release scripts (temp git repos, stubs, no network)"
shell = "bash -c"
run = ["bash tool/check_dco_test.sh", "bash tool/release/test/release_test.sh"]

# COMPATIBILITY.md of ghostty_dart_xterm (ADR 0013, "Evidence"):
# tool/xterm_compat compares xterm 4.0.0's API (a committed analyzer snapshot)
# with the adapter's, merged with the hand-kept tool/xterm_compat/status.json.
# The snapshot is retaken only by hand and reviewed, like native:pin; it fails
# closed unless the locked xterm archive sha256 and the hash of its lib/ tree
# match the pins in tool/xterm_compat/src/pin.dart. compat and compat:check
# read only the snapshot and the adapter's sources (no network).
[tasks."compat:snapshot"]
description = "Re-take tool/xterm_compat/xterm-4.0.0.api.json from the locked xterm 4.0.0 (fail-closed pins; review the diff)"
run = "dart tool/xterm_compat/compat.dart snapshot"

[tasks.compat]
description = "Regenerate packages/ghostty_dart_xterm/COMPATIBILITY.md from the snapshot, the adapter and status.json"
run = "dart tool/xterm_compat/compat.dart write"

[tasks."compat:check"]
description = "Fail if COMPATIBILITY.md is stale or tool/xterm_compat/status.json is inconsistent"
run = "dart tool/xterm_compat/compat.dart check"

[tasks.check]
description = "Everything CI runs locally"
depends = [
  "analyze",
  "test",
  "test:flutter",
  "test:xterm",
  "demo:test",
  "bench:widget:test",
  "test:tool",
  "test:release",
  "compat:check",
  "cooldown",
  "docs:translations",
  "lint:ci",
]
