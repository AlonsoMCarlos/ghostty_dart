name: ghostty_dart
description: >-
  Dart bindings for libghostty-vt, the terminal emulation engine of Ghostty:
  VT parsing, screen and render state, selection, search, key/mouse encoding.
version: 0.1.1
repository: https://github.com/AlonsoMCarlos/ghostty_dart/tree/main/packages/ghostty_dart
issue_tracker: https://github.com/AlonsoMCarlos/ghostty_dart/issues
topics: [terminal, terminal-emulator, ffi, vt100, ghostty]

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0

dev_dependencies:
  # analyzer 13 and test 1.31: flutter_test (Flutter 3.47.9) pins
  # test_api 0.7.12, which test >= 1.32 and analyzer 14 exclude; the
  # workspace also holds ghostty_dart_flutter. Raise both together with the
  # pinned Flutter (2026-11-10).
  analyzer: ^13.3.0
  ffigen: ^23.0.0
  # analysis_options.yaml includes package:lints; pana keeps hosted
  # dev_dependencies when it analyses the archive.
  lints: ^6.1.0
  test: ^1.31.1  # see analyzer above
